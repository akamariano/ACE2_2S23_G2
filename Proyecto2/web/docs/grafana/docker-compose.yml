version: "3.9"
services:
  grafana:
    image: grafana/grafana:9.2.6
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - 3001:3000
    networks:
      - my_network

  redis:
    image: bitnami/redis:7.0.5
    ports:
      - 6379:6379
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD=my_master_password
    networks:
      - my_network

  prometheus:
    image: prom/prometheus:v2.40.3
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - my_network

  redis-exporter:
    image: oliver006/redis_exporter:v1.45.0
    ports:
      - 9121:9121
    environment:
      REDIS_ADDR: "redis-16132.c14.us-east-1-3.ec2.cloud.redislabs.com:16132"
      REDIS_USER: default
      REDIS_PASSWORD: 8EFmRwb0CzBa8yuiMLBnHlgIOjpv9MDs
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
